<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topshelf</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="topshelf.css" />
  <script src="topshelf.js" defer></script>
</head>
<body class="fade-in">
  <div id="topshelf-backdrop-a" class="topshelf-backdrop"></div>
  <div id="topshelf-backdrop-b" class="topshelf-backdrop"></div>
  <div class="topshelf-scrim"></div>

  <div class="topshelf-info" id="topshelf-info">
    <img id="topshelf-logo" class="topshelf-logo" alt="" />
    <div id="topshelf-title" class="topshelf-title"></div>
    <p id="topshelf-overview" class="topshelf-overview"></p>
  </div>

  <div class="topshelf-dots" id="topshelf-dots"></div>
  <div class="topshelf-hint">← → zum Wechseln · Enter öffnet die App · Backspace zurück</div>
</body>
</html>
