<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Musikplayer</title>
  <link rel="stylesheet" href="media-player.css" />
  <script src="marquee.js" defer></script>
  <script src="media-player.js" defer></script>
</head>
<body>
  <div id="player" class="glass" data-state="idle">
    <!-- Bildfläche (nur sichtbar, wenn der Knopf oben links an ist): Video-Bilder oder Titelbild, sonst ein Platzhalter -->
    <div id="mp-picture" class="mp-picture" hidden>
      <video id="mp-stream" class="mp-img" muted autoplay playsinline hidden></video>
      <img id="mp-img" class="mp-img" alt="" draggable="false" hidden />
      <svg id="mp-placeholder" class="mp-placeholder" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
    </div>

    <button type="button" id="mp-video" class="mp-corner mp-video" title="Bild anzeigen" aria-label="Bild anzeigen" aria-pressed="false" data-nodrag>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="13" height="11" rx="2.6" /><path d="M15.5 10.4l5.6-3.2v9.6l-5.6-3.2z" /></svg>
    </button>
    <button type="button" id="mp-close" class="mp-corner mp-close" title="Schließen (M)" aria-label="Schließen" data-nodrag>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
    </button>

    <div class="mp-body">
      <!-- Titel – Interpret, mittig über dem Balken (zu lang: Laufschrift) -->
      <div id="mp-title" class="mp-title empty" aria-live="off"><span></span></div>
      <div class="mp-progress-row">
        <span id="mp-current" class="mp-time">0:00</span>
        <div id="mp-track" class="mp-track" data-nodrag role="slider" aria-label="Wiedergabeposition" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="mp-bar">
            <div id="mp-fill" class="mp-fill"></div>
          </div>
          <div id="mp-thumb" class="mp-thumb"></div>
        </div>
        <span id="mp-duration" class="mp-time">0:00</span>
      </div>

      <div class="mp-controls">
        <button type="button" id="mp-prev" class="mp-btn" title="Zurück" aria-label="Zurück" data-nodrag>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.6" y="5.2" width="2.6" height="13.6" rx="1.2" /><path d="M19 6.2v11.6L9.4 12z" /></svg>
        </button>
        <button type="button" id="mp-play" class="mp-btn mp-btn-main" title="Wiedergabe / Pause" aria-label="Wiedergabe / Pause" data-nodrag>
          <svg id="mp-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 4.8v14.4L19.2 12z" /></svg>
          <svg id="mp-icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="5.6" y="4.8" width="4.4" height="14.4" rx="1.4" /><rect x="14" y="4.8" width="4.4" height="14.4" rx="1.4" /></svg>
        </button>
        <button type="button" id="mp-next" class="mp-btn" title="Weiter" aria-label="Weiter" data-nodrag>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.8" y="5.2" width="2.6" height="13.6" rx="1.2" /><path d="M5 6.2v11.6L14.6 12z" /></svg>
        </button>
      </div>
    </div>

    <!-- Größe des Players: 1x = Standardgröße (ohne Bild 300 px, mit Bild 400 px Breite), 2x und 3x = doppelt/dreifach -->
    <div class="mp-sizes" role="group" aria-label="Größe des Players">
      <button type="button" class="mp-size" data-scale="1" title="Größe 1x" aria-label="Größe 1x" data-nodrag>1x</button>
      <button type="button" class="mp-size" data-scale="2" title="Größe 2x" aria-label="Größe 2x" data-nodrag>2x</button>
      <button type="button" class="mp-size" data-scale="3" title="Größe 3x" aria-label="Größe 3x" data-nodrag>3x</button>
    </div>

    <!-- unsichtbare Zieh-Ränder zum Ändern der Größe (die Fensterkanten selbst sind unter Windows bei durchsichtigen Fenstern nicht greifbar) -->
    <div class="mp-edge mp-edge-n" data-edge="n" data-nodrag></div>
    <div class="mp-edge mp-edge-s" data-edge="s" data-nodrag></div>
    <div class="mp-edge mp-edge-w" data-edge="w" data-nodrag></div>
    <div class="mp-edge mp-edge-e" data-edge="e" data-nodrag></div>
    <div class="mp-edge mp-edge-nw" data-edge="nw" data-nodrag></div>
    <div class="mp-edge mp-edge-ne" data-edge="ne" data-nodrag></div>
    <div class="mp-edge mp-edge-sw" data-edge="sw" data-nodrag></div>
    <div class="mp-edge mp-edge-se" data-edge="se" data-nodrag></div>
  </div>
</body>
</html>
