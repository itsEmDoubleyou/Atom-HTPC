<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Intro</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: none; }
    /* Bühne mit schwarzem Grund: sie wird als Ganzes sanft ein- und ausgeblendet (Opacity setzt intro-play.js) */
    #stage { position: fixed; inset: 0; background: #000; opacity: 0; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline preload="auto"></video>
  </div>
  <script src="intro-play.js"></script>
</body>
</html>
